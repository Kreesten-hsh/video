<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Agent404 // Cyber-Mint Video</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="video-canvas" class="bg-grid">
    <!-- HUD AGENT404 tout en haut -->
    <div id="agent-hud">
      <div class="hud-brand">
        <span class="hud-dot"></span>
        <span class="hud-brand-text">AGENT404 // SYS.ONLINE</span>
      </div>
      <div class="hud-right">
        <span class="hud-timer" id="hud-timer">00:00 // 30FPS</span>
        <div id="hud-progress-bar">
          <div id="hud-progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Zone Sous-titres (Top 96px) -->
    <header id="subtitles-zone">
      <div id="subtitles-container">
        <div id="subtitles-box" class="sub-line"></div>
      </div>
    </header>

    <!-- Zone centrale & inférieure : Rendu des composants -->
    <main id="scene-zone">
      <div id="scene-container"></div>
    </main>
  </div>

  <script src="timeline.js"></script>
  <script src="video.js"></script>
</body>
</html>
