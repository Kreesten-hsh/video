<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Agent404 // Cyber-Mint Video</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="video-canvas" class="bg-grid">
    <!-- Zone Sous-titres (Top 96px) -->
    <header id="subtitles-zone">
      <div id="subtitles-container">
        <div id="subtitles-box" class="sub-line"></div>
      </div>
    </header>

    <!-- Zone centrale & inférieure : Rendu des composants -->
    <main id="scene-zone">
      <div id="scene-container"></div>
    </main>
  </div>

  <script>
    // Chargement dynamique de la timeline si spécifiée en paramètre d'URL (?timeline=...)
    const urlParams = new URLSearchParams(window.location.search);
    const timelineParam = urlParams.get('timeline');
    if (timelineParam) {
      document.write('<script src="' + encodeURI(timelineParam) + '"><\/script>');
    } else if (typeof window.WORDS === 'undefined') {
      document.write('<script src="studio_perso/video_01/timeline.js"><\/script>');
    }
  </script>
  <script src="video.js"></script>
</body>
</html>
