<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>AGENT404 Obsidian Flame</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="video-canvas" class="bg-grid" data-theme="cyber-mint">

    <!-- Calque d'Arrière-Plan Vivant (Parallaxe 30%) -->
    <div id="bg-layer" class="layer-bg">
      <div id="ambient-glow" class="ambient-glow"></div>
      <div id="watermark-text" class="watermark-text"></div>
    </div>

    <!-- Caméra Virtuelle Dynamique -->
    <div id="camera-rig">
      <!-- Zone centrale & inférieure : Rendu des composants -->
      <main id="scene-zone">
        <div id="scene-container"></div>
      </main>
    </div>

    <!-- Avatar Global Chorégraphié (hero, inset, hidden) -->
    <div id="global-avatar-wrapper" class="avatar-hidden">
      <img id="global-avatar-img" src="" alt="Avatar" />
    </div>

    <!-- Zone Sous-titres Multi-Zones Dynamique -->
    <header id="subtitles-zone" class="mode-center-slam">
      <div id="subtitles-container">
        <div id="subtitles-box" class="sub-line"></div>
      </div>
    </header>
  </div>

  <script>
    // Chargement dynamique multi-tenant (?project=..., ?timeline=..., ?brand=...)
    const urlParams = new URLSearchParams(window.location.search);
    const projectParam = urlParams.get('project');
    const timelineParam = urlParams.get('timeline') || (projectParam ? (projectParam.endsWith('/') ? projectParam + 'timeline.js' : projectParam + '/timeline.js') : null);
    const brandParam = urlParams.get('brand') || (projectParam ? (projectParam.endsWith('/') ? projectParam + 'brand.json' : projectParam + '/brand.json') : null);

    if (brandParam) {
      window.BRAND_URL = brandParam;
    }

    if (timelineParam) {
      document.write('<script src="' + encodeURI(timelineParam) + '"><\/script>');
    }
  </script>
  <script src="video.js"></script>
</body>
</html>
